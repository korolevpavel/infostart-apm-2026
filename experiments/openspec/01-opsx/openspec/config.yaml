schema: spec-driven

context: |
  Это эксперимент по подготовке спецификации на основе ЗНР.docx.
  Используй только материалы этой папки.
  Не читай соседние папки, исходники конфигурации и результаты предыдущих экспериментов.
  Не используй Unica и другие специализированные скиллы и инструменты 1С.
  Пиши документы OpenSpec на русском языке.
  Сохраняй служебные заголовки и ключевые слова SHALL/MUST, необходимые формату OpenSpec.
  Пока не создавай предложение изменения и не начинай реализацию.
