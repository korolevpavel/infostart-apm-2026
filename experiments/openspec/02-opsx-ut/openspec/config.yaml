schema: spec-driven

context: |
  Язык документов: русский.
  Все документы OpenSpec пиши на русском языке.
  Сохраняй обязательный синтаксис OpenSpec, структурные заголовки и ключевые слова SHALL/MUST на английском языке.
  Это второй эксперимент по подготовке спецификации на основе ЗНР.docx и исходников УТ 11 в src/.
  Используй только материалы этой папки; не читай соседние папки и результаты других экспериментов.
  Исходники исследуй обычным поиском и чтением файлов. Не используй Unica и другие специализированные скиллы и инструменты 1С.
  Пока не создавай предложение изменения и не начинай реализацию.

