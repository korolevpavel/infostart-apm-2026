name: Publish dashboards

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - sites/znr-overview/dashboard.html
      - sites/openspec-experiments/dashboard.html
      - sites/build_pages.py
      - .github/workflows/dashboard-pages.yml

permissions:
  contents: read

concurrency:
  group: dashboard-pages
  cancel-in-progress: true

jobs:
  deploy:
    # Also applies to manual runs: private repositories must never publish.
    if: ${{ github.event.repository.private == false && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare both dashboards
        shell: bash
        run: |
          python3 sites/build_pages.py "$RUNNER_TEMP/znr-pages"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload both dashboards only
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/znr-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
